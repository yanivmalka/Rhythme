# Builds a signed APK on every push to main and publishes it as a GitHub release "build-N".
# The app checks the latest release and offers the update (see Updater.kt).
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key from secrets
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No signing secrets yet: the code is compiled but no APK is published"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/rhythme-shared.keystore

      - name: Build APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          # Kotlin/Gradle errors as annotations, visible on the run page (also from a phone)
          grep -E '^e: |What went wrong|error:' -A 2 build.log | head -40 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done
          exit 1

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.run_number }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "::error::Add secrets SIGNING_KEYSTORE_BASE64 and SIGNING_PASSWORD (Settings > Secrets and variables > Actions) to publish the APK"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "Rhythme-build-$N.apk"
          gh release delete "build-$N" --yes --cleanup-tag 2>/dev/null || true
          gh release create "build-$N" "Rhythme-build-$N.apk" \
            --title "Build $N" --notes "${MSG:-Manual build}" --target "$GITHUB_SHA" --latest
